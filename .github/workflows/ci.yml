name: android-ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Debug build gate (JDK 17 + Android SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (compileSdk 36 / buildTools 36.0.0 / NDK 21.4)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;21.4.7075529"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle', 'settings.gradle', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Upstream bootstrap (buildsystem/compile.sh --init):
      #  - downloads Gradle 9.6.0 (sha256-verified) and generates ./gradlew
      #  - clones libvlcjni (libvlcjni-3.x @ tested hash) and the vlc source
      #    needed for final-assembly packaging (lua/hrtfs)
      #  - exits before native compilation; debug variants consume the
      #    published libvlc-all / medialibrary artifacts from Maven Central
      - name: Bootstrap (compile.sh --init)
        run: |
          git config --global --add safe.directory "$PWD/libvlcjni"
          ./buildsystem/compile.sh --init

      - name: Build debug APK
        run: ./gradlew :application:app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-player-debug-apk
          path: application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
